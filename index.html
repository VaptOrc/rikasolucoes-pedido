<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaptOrc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233D; --ink-soft:#243350; --blueprint:#2F5D8A; --copper:#B9662E; --copper-dark:#9A5323;
    --paper:#F6F4EF; --paper-dim:#EDEAE2; --card:#FFFFFF; --slate:#5B6472; --line:#DDD8CC;
    --amber:#C98F1E; --blue-status:#3B6EA5; --green:#3F8F5F; --red:#B8493F; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:#3A3F46;font-family:'Inter',sans-serif;color:var(--ink);display:flex;justify-content:center;min-height:100vh;padding:28px 12px;}
  h1,h2,h3,.brand,nav .label{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  #frame{width:100%;max-width:412px;height:860px;background:var(--paper);border-radius:28px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;border:1px solid rgba(0,0,0,.08);}

  header{background:var(--ink);color:var(--white);padding:20px 18px 16px;flex-shrink:0;}
  header .top-row{display:flex;align-items:center;gap:10px;}
  header .back{background:none;border:none;color:var(--white);font-size:20px;cursor:pointer;padding:0 4px 0 0;line-height:1;opacity:.85;}
  header .back:hover{opacity:1;}
  header h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.2px;}
  header .subtitle{margin:4px 0 0;font-size:12.5px;color:#B9C3D6;}

  main{flex:1;overflow-y:auto;padding:18px 18px 90px;}
  .screen{display:none;}
  .screen.active{display:block;}

  .home-hero{background:linear-gradient(135deg,var(--ink) 0%,var(--blueprint) 130%);color:var(--white);border-radius:16px;padding:20px;margin-bottom:20px;}
  .home-hero .eyebrow{font-size:11.5px;color:#CBD8E8;margin:0 0 6px;}
  .home-hero h2{margin:0 0 4px;font-size:20px;}
  .home-hero p{margin:0;font-size:13px;color:#DCE4EF;line-height:1.5;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;cursor:pointer;transition:border-color .15s ease, transform .1s ease;}
  .tile:hover{border-color:var(--blueprint);}
  .tile:active{transform:scale(.98);}
  .tile .icon{width:26px;height:26px;margin-bottom:10px;color:var(--blueprint);}
  .tile .icon svg{width:100%;height:100%;}
  .tile .name{font-size:14px;font-weight:600;color:var(--ink);}
  .tile .desc{font-size:11.5px;color:var(--slate);margin-top:3px;line-height:1.4;}

  .cta-full{margin-top:18px;width:100%;background:var(--copper);color:var(--white);border:none;padding:14px;border-radius:12px;font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;cursor:pointer;}
  .cta-full:hover{background:var(--copper-dark);}
  .cta-full:disabled{background:#C9B9A9;cursor:default;}

  .filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
  .chip{flex-shrink:0;padding:7px 13px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--slate);cursor:pointer;white-space:nowrap;}
  .chip.active{background:var(--ink);color:var(--white);border-color:var(--ink);}

  .quote-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--slate);border-radius:10px;padding:13px 14px;margin-bottom:10px;cursor:pointer;}
  .quote-card.status-pendente{border-left-color:var(--amber);}
  .quote-card.status-aprovado{border-left-color:var(--blue-status);}
  .quote-card.status-andamento{border-left-color:var(--blueprint);}
  .quote-card.status-concluido{border-left-color:var(--green);}
  .quote-card.status-cancelado{border-left-color:var(--red);}
  .quote-card .row1{display:flex;justify-content:space-between;align-items:baseline;}
  .quote-card .num{font-size:12px;color:var(--slate);}
  .quote-card .cat-tag{font-size:10.5px;color:var(--slate);}
  .quote-card .cliente{font-size:14.5px;font-weight:600;margin:3px 0 6px;}
  .quote-card .row2{display:flex;justify-content:space-between;align-items:center;}
  .quote-card .valor{font-size:14px;font-weight:600;}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:500;}
  .badge.status-pendente{background:#FBF0DA;color:#8A6314;}
  .badge.status-aprovado{background:#E1EAF3;color:#2C4E71;}
  .badge.status-andamento{background:#DCE7F1;color:#264A6E;}
  .badge.status-concluido{background:#E1F0E6;color:#2C6B45;}
  .badge.status-cancelado{background:#F3E1DF;color:#8A362D;}
  .badge.status-aguardando_pagamento{background:#DCE7F1;color:#264A6E;}
  .badge.status-garantia{background:#E1F0E6;color:#2C6B45;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--slate);}
  .empty-state p{font-size:13px;line-height:1.5;}

  .simple-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;font-size:13.5px;display:flex;justify-content:space-between;}
  .simple-item span.sub{color:var(--slate);font-size:12px;}

  .field-group{margin-bottom:18px;}
  .field-group .label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field-group .hint{font-size:11px;color:var(--slate);margin-top:4px;line-height:1.4;}
  input[type=text], input[type=number], input[type=email], input[type=password], textarea, select{
    width:100%;font-family:'Inter',sans-serif;font-size:13.5px;padding:10px 11px;border-radius:8px;border:1px solid var(--line);background:var(--white);color:var(--ink);
  }
  textarea{resize:vertical;min-height:70px;line-height:1.5;}
  input:focus, textarea:focus,
